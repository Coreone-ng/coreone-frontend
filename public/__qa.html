<!doctype html><html><head><meta charset="utf-8"><title>CoreOne viewport verification</title><style>*{box-sizing:border-box}body{font:13px system-ui;margin:0;background:#ddd;color:#111}header{padding:8px;background:#fff;display:flex;gap:5px;flex-wrap:wrap;position:sticky;top:0;z-index:2}button{padding:7px;cursor:pointer}#status{padding:8px;margin:0;background:#fff;white-space:pre-wrap}#stage{position:relative;overflow:hidden;margin:10px auto;background:white}iframe{border:0;transform-origin:top left;display:block}</style></head><body><header id="controls"><span>Viewport:</span></header><pre id="status">Loading…</pre><div id="stage"><iframe id="view" title="CoreOne test viewport" src="/"></iframe></div><script>
const widths=[320,375,768,1024,1440,1920], sections=['home','features','compliance','security','pricing','testimonials','cta','footer'];
const frame=document.querySelector('iframe'),status=document.querySelector('#status'),stage=document.querySelector('#stage');let width=1920;const errors=[];
function setWidth(w){width=w;frame.style.width=w+'px';frame.style.height='1200px';const scale=Math.min(1,(innerWidth-20)/w);frame.style.transform=`scale(${scale})`;stage.style.width=w*scale+'px';stage.style.height=1200*scale+'px';setTimeout(report,250)}
function report(){const d=frame.contentDocument;if(!d?.body)return;const imgs=[...d.images].filter(i=>i.getBoundingClientRect().width>0);const broken=imgs.filter(i=>i.complete&&!i.naturalWidth).map(i=>i.getAttribute('src'));const ids=[...d.querySelectorAll('[id]')].map(e=>e.id);const duplicates=ids.filter((id,i)=>ids.indexOf(id)!==i);const active=d.querySelector('[role="tab"][aria-selected="true"]');status.textContent=JSON.stringify({viewport:width,innerWidth:frame.contentWindow.innerWidth,scrollWidth:d.documentElement.scrollWidth,overflow:d.documentElement.scrollWidth>width,brokenImages:broken,duplicateIds:duplicates,activeFeature:active?.textContent,h1:d.querySelectorAll('h1').length,annualDisabled:d.querySelector('[title="Annual pricing is not available yet"]')?.disabled,errors})}
for(const w of widths){const b=document.createElement('button');b.textContent=w;b.onclick=()=>setWidth(w);controls.append(b)}
for(const name of sections){const b=document.createElement('button');b.textContent=name;b.onclick=()=>{const d=frame.contentDocument;let el=d.getElementById(name);if(name==='testimonials')el=d.querySelector('[aria-labelledby="testimonials-title"]');if(name==='cta')el=d.querySelector('[aria-labelledby="cta-title"]');if(name==='footer')el=d.querySelector('footer');frame.contentWindow.scrollTo({top:el.offsetTop,behavior:'instant'});setTimeout(report,300)};controls.append(b)}
const b=document.createElement('button');b.textContent='Recheck';b.onclick=report;controls.append(b);
frame.onload=()=>{frame.contentWindow.addEventListener('error',e=>errors.push(e.message));frame.contentWindow.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));setWidth(width)};
</script></body></html>
